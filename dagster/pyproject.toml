[project]
name = "dagster-vellum"
version = "0.1.0"
description = "Dagster ingestion pipeline for the Vellum RAG platform"
requires-python = ">=3.12"

dependencies = [
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "qdrant-client>=1.9",
    "httpx>=0.27",
    "pypdf>=4.0",
    "boto3>=1.34",
    "aiofiles>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.dagster]
module_name = "dagster_vellum.definitions"
