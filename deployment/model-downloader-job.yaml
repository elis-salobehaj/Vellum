apiVersion: batch/v1
kind: Job
metadata:
  name: model-downloader
  namespace: kubeflow-vellum
spec:
  backoffLimit: 2
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: downloader
          image: vllm/vllm-openai:latest-cu130
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "Cleaning target directory..."
              rm -rf /mnt/models/Qwen3.5-2B
              mkdir -p /mnt/models/Qwen3.5-2B
              
              echo "Downloading Model: Qwen3.5-2B..."
              huggingface-cli download Qwen/Qwen3.5-2B --local-dir /mnt/models/Qwen3.5-2B --local-dir-use-symlinks False
              
              echo "Downloading Embedding Model: BAAI/bge-small-en-v1.5..."
              rm -rf /mnt/models/bge-small-en-v1.5
              mkdir -p /mnt/models/bge-small-en-v1.5
              huggingface-cli download BAAI/bge-small-en-v1.5 --local-dir /mnt/models/bge-small-en-v1.5 --local-dir-use-symlinks False

              echo "Download Complete! Listing files:"
              ls -R /mnt/models
          volumeMounts:
            - name: model-volume
              mountPath: /mnt/models
      restartPolicy: OnFailure
      volumes:
        - name: model-volume
          persistentVolumeClaim:
            claimName: llm-models-pvc
