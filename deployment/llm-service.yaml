apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llm-service
  namespace: kubeflow-vellum
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    runtimeClassName: nvidia
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:latest-cu130
        imagePullPolicy: IfNotPresent
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
          - "--model"
          - "/mnt/models/Qwen3.5-2B"
          - "--served-model-name"
          - "Qwen3.5-2B"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8080"
          - "--dtype"
          - "half"
          - "--enforce-eager"
          - "--max-model-len"
          - "4096"
          - "--gpu-memory-utilization"
          - "0.85"
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: 8Gi
          requests:
            nvidia.com/gpu: 1
            memory: 6Gi
        volumeMounts:
          - name: model-volume
            mountPath: /mnt/models
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
    volumes:
      - name: model-volume
        persistentVolumeClaim:
          claimName: llm-models-pvc
