apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kubeflow-vellum
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: vellum-backend-sa
      containers:
      - name: backend
        image: vellum-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: vellum-env
        env:
        - name: QDRANT_HOST
          value: "qdrant.qdrant.svc.cluster.local"
        - name: LLM_SERVICE_URL
          value: "http://llm-service-predictor.kubeflow-vellum.svc.cluster.local:80/v1"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kubeflow-vellum
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
