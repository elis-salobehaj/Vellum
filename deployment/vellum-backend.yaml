apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kubeflow-vellum
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: vellum-backend-sa
      containers:
      - name: backend
        image: vellum-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: vellum-env
        env:
        - name: EMBEDDING_MODEL_NAME
          value: "BAAI/bge-small-en-v1.5"
        - name: EMBEDDINGS_SERVICE_URL
          value: "http://embeddings-service.kubeflow-vellum.svc.cluster.local/v1"
        - name: QDRANT_HOST
          value: "qdrant.qdrant.svc.cluster.local"
        - name: LLM_SERVICE_URL
          value: "http://llm-service-head-svc.vellum-ray.svc.cluster.local:8000/v1"
        - name: DAGSTER_GRAPHQL_URL
          value: "http://dagster-dagster-webserver.kubeflow-vellum.svc.cluster.local:3000/graphql"
        - name: DOCUMENT_STORAGE_PATH
          value: "/data/documents"
        - name: USE_S3_STORAGE
          value: "false"
        - name: INGESTION_MODE
          value: "direct"
        volumeMounts:
        - name: documents
          mountPath: /data/documents
      volumes:
      - name: documents
        persistentVolumeClaim:
          claimName: documents-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kubeflow-vellum
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
