apiVersion: v1
kind: ConfigMap
metadata:
  name: ray-serve-llm-script
  namespace: vellum-ray
data:
  ray_serve_llm.py: |
    from ray import serve
    from fastapi import FastAPI, Request
    from fastapi.responses import JSONResponse

    app = FastAPI()

    @serve.deployment(
        ray_actor_options={"num_cpus": 1},
        max_ongoing_requests=10,
    )
    @serve.ingress(app)
    class VLLMDeployment:
        def __init__(self):
            pass

        @app.post("/v1/chat/completions")
        async def create_chat_completion(self, request: Request):
            req_json = await request.json()
            return JSONResponse(content={
                "id": "chatcmpl-mock",
                "object": "chat.completion",
                "created": 1677652288,
                "choices": [{
                    "index": 0,
                    "message": {
                        "role": "assistant",
                        "content": "Hello! I am a simulated response from Ray Serve because local GPU passthrough is unavailable in Kind. The Ray Operator is successfully managing traffic!",
                    },
                    "finish_reason": "stop"
                }],
                "usage": {"prompt_tokens": 0, "completion_tokens": 20, "total_tokens": 20}
            })

---
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: llm-service
  namespace: vellum-ray
spec:
  serveConfigV2: |
    applications:
      - name: llm
        import_path: ray_serve_llm:app
        route_prefix: /v1
  rayClusterConfig:
    rayVersion: "2.54.0"
    headGroupSpec:
      rayStartParams:
        dashboard-host: '0.0.0.0'
      template:
        spec:
          containers:
            - name: ray-head
              image: rayproject/ray:2.9.0-py310
              env:
                - name: PYTHONPATH
                  value: "/mnt/script"
              ports:
                - containerPort: 6379
                  name: gcs
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
                - containerPort: 8000
                  name: serve
              volumeMounts:
                - name: script-vol
                  mountPath: /mnt/script
          volumes:
            - name: script-vol
              configMap:
                name: ray-serve-llm-script
    workerGroupSpecs:
      - groupName: cpu-workers
        replicas: 1
        minReplicas: 1
        maxReplicas: 1
        rayStartParams: {}
        template:
          spec:
            containers:
              - name: ray-worker
                image: rayproject/ray:2.9.0-py310
                env:
                  - name: PYTHONPATH
                    value: "/mnt/script"
                resources:
                  limits:
                    cpu: 1
                    memory: "4Gi"
                  requests:
                    cpu: 1
                    memory: "2Gi"
                volumeMounts:
                  - name: script-vol
                    mountPath: /mnt/script
            volumes:
              - name: script-vol
                configMap:
                  name: ray-serve-llm-script
