apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Phase 4: Kubeflow manifests submodule removed.
# Platform services (Istio Ambient, Qdrant, Dagster, KubeRay) are now installed
# via their respective Helm charts in setup-kind.sh.
# This kustomization only manages Vellum application resources.

resources:
  # ── Namespace + RBAC ───────────────────────────────────────────────────────
  - vellum-namespace.yaml
  - vellum-backend-rbac.yaml

  # ── Persistent Storage ─────────────────────────────────────────────────────
  - documents-pvc.yaml
  - llm-models-pvc.yaml

  # ── Vellum Application ─────────────────────────────────────────────────────
  - vellum-backend.yaml
  - vellum-frontend.yaml

  # ── Istio Ambient (waypoint + AuthorizationPolicy + RequestAuthentication) ─
  - vellum-istio.yaml

  # ── AI / Inference ─────────────────────────────────────────────────────────
  - embeddings-service.yaml
  - model-downloader-job.yaml
  - ray-serve-llm.yaml
