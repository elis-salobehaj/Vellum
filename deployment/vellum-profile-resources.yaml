apiVersion: v1
kind: ServiceAccount
metadata:
  name: default-editor
  namespace: kubeflow-vellum
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default-viewer
  namespace: kubeflow-vellum
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: namespaceAdmin
  namespace: kubeflow-vellum
  annotations:
    role: admin
    user: vellum@example.com
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeflow-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: vellum@example.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: default-editor
  namespace: kubeflow-vellum
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeflow-edit
subjects:
  - kind: ServiceAccount
    name: default-editor
    namespace: kubeflow-vellum
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: default-viewer
  namespace: kubeflow-vellum
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeflow-view
subjects:
  - kind: ServiceAccount
    name: default-viewer
    namespace: kubeflow-vellum