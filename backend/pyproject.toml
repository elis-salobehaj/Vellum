[project]
name = "vellum-backend"
version = "0.1.0"
description = "Vellum Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "python-multipart",
    "python-jose[cryptography]",
    "msal",
    "llama-index-core",
    "llama-index-vector-stores-qdrant>=0.3.0",
    "llama-index-embeddings-openai",
    "llama-index-llms-openai-like",
    "llama-index-llms-gemini",
    "qdrant-client>=1.12.0",
    "httpx",
    "python-dotenv",
    "openai",
    "kfp>=2.5.0",
    "minio",
    "structlog",
    "requests-toolbelt<1.0.0",
    "urllib3<2.0.0",
    "boto3",
    "langchain",
    "langchain-core",
    "langchain-aws",
    "langchain-openai",
    "langgraph",
    "llama-index-readers-s3",
    "llama-index-readers-file",
    "pypdf",
    "google-generativeai>=0.8.0",
    "vellum-ingestion",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "python-pptx>=1.0.2",
    "docx2txt>=0.9",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.uv.sources]
vellum-ingestion = { path = "../kubeflow/pipelines/ingestion" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pytest-cov",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
