[project]
name = "vellum-backend"
version = "0.1.0"
description = "Vellum Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "python-multipart",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "msal",
    "llama-index-core",
    "llama-index-vector-stores-qdrant",
    "llama-index-embeddings-openai",
    "llama-index-llms-openai-like",
    "llama-index-llms-gemini",
    "qdrant-client",
    "httpx",
    "python-dotenv",
    "openai",
    "tiktoken",
    "kfp",
    "minio",
    "structlog",
    "rich",
    "requests-toolbelt<1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pytest-cov",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
