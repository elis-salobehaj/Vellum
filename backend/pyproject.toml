[project]
name = "vellum-backend"
version = "0.1.0"
description = "Vellum Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "python-multipart",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "msal",
    "llama-index-core",
    "llama-index-vector-stores-qdrant",
    "llama-index-embeddings-openai",
    "llama-index-llms-openai-like",
    "llama-index-llms-gemini",
    "qdrant-client",
    "httpx",
    "python-dotenv",
    "openai",
    "tiktoken",
    "kfp",
    "minio",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio",
]
