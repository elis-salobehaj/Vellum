name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ hashFiles('backend/uv.lock', 'frontend/pnpm-lock.yaml', 'backend/Dockerfile', 'frontend/Dockerfile') }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build and Run Backend Tests
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./backend/Dockerfile
        target: test
        build-args: BUILD_MODE=ci
        push: false
        load: true
        tags: vellum-backend-test:latest
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

    - name: Run Tests
      run: docker run --rm -e BYPASS_AUTH=true vellum-backend-test:latest

    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  ingestion-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Ingestion Image
      run: |
        docker build -t vellum-backend:latest -f backend/Dockerfile .
        docker build -t vellum-ingest -f kubeflow/pipelines/ingestion/Dockerfile .

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Frontend
      run: |
        docker build --target builder -t vellum-frontend-build \
          --build-arg VITE_API_URL=/api/v1 \
          --build-arg VITE_BYPASS_AUTH=true \
          -f frontend/Dockerfile .
  
  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Run Lint in Playwright Container
      run: |
        docker build --target test -t vellum-frontend-test -f frontend/Dockerfile .
        docker run --rm vellum-frontend-test pnpm lint
